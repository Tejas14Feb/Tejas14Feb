name: Update Projects Table

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Projects Table
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const username = context.repo.owner;

            const { data: repos } = await github.rest.repos.listForUser({
              username,
              sort: 'updated',
              per_page: 100
            });

            const filtered = repos.filter(repo =>
              !repo.fork &&
              repo.name !== username
            );

            let table = `| Project | Description | Links |
|---|---|---|
`;

            for (const repo of filtered) {
              table += `| ${repo.name} | ${repo.description || 'No description'} | [GitHub](${repo.html_url}) |\n`;
            }

            const readmePath = 'README.md';
            let readme = fs.readFileSync(readmePath, 'utf8');

            const start = '<!-- PROJECTS_TABLE:START -->';
            const end = '<!-- PROJECTS_TABLE:END -->';

            const newSection = `${start}\n${table}\n${end}`;

            const regex = new RegExp(`${start}[\\s\\S]*${end}`, 'm');

            readme = readme.replace(regex, newSection);

            fs.writeFileSync(readmePath, readme);

      - name: Commit Changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add README.md

          git diff --cached --quiet || git commit -m "Auto-update projects table"

          git push
