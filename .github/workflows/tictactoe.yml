name: Tic-tac-toe

on:
  issues:
    types: [opened]

# One move at a time, so two players can't overwrite each other's board.
concurrency:
  group: tictactoe
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  play:
    if: startsWith(github.event.issue.title, 'ttt|')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Issue title and author arrive through env vars, never pasted into the
      # script itself, so a crafted title can't inject shell commands.
      - name: Play the move
        env:
          TITLE: ${{ github.event.issue.title }}
          PLAYER: ${{ github.event.issue.user.login }}
          TTT_MESSAGE_FILE: ${{ runner.temp }}/ttt_message.md
        run: python3 tools/ttt.py play

      - name: Commit the new board
        env:
          PLAYER: ${{ github.event.issue.user.login }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/ttt
          if ! git diff --cached --quiet; then
            git commit -m "ttt: move by @${PLAYER}"
            git push
          fi

      - name: Reply and close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/ttt_message.md"
          gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY"
