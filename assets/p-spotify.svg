<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 230" width="490" height="230" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace">
<style>
