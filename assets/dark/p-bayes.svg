<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 230" width="490" height="230" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace">
<style>
text { fill: #e6edf3; }
.m { fill: #8b949e; }
.a { fill: #FF9933; }
.flow { stroke-dasharray: 5 7; animation: flow 1.6s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -24; } }
.blink { animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .flow, .blink { animation: none; } }

</style>
<rect width="490" height="230" fill="#0d1117"/>
<rect x="1" y="1" width="488" height="228" fill="#0d1117" stroke="#30363d" stroke-width="1.2"/>
<text x="28" y="46" font-size="17" text-anchor="start" font-weight="700" letter-spacing="0">bayesian-cq-analysis</text>
<text x="28" y="84" font-size="14" text-anchor="start" font-weight="400" letter-spacing="0" class="m">Bayesian regression of phosphorus</text>
<text x="28" y="106" font-size="14" text-anchor="start" font-weight="400" letter-spacing="0" class="m">concentration against stream discharge, with</text>
<text x="28" y="128" font-size="14" text-anchor="start" font-weight="400" letter-spacing="0" class="m">exact posteriors and predictive checks.</text>
<rect x="28" y="180" width="72.4" height="26" fill="none" stroke="#e6edf3"/>
<text x="64.2" y="198" font-size="12" text-anchor="middle" font-weight="400" letter-spacing="0">Python</text>
<rect x="110.4" y="180" width="64.0" height="26" fill="none" stroke="#e6edf3"/>
<text x="142.4" y="198" font-size="12" text-anchor="middle" font-weight="400" letter-spacing="0">SciPy</text>
<rect x="184.4" y="180" width="89.2" height="26" fill="none" stroke="#e6edf3"/>
<text x="229.0" y="198" font-size="12" text-anchor="middle" font-weight="400" letter-spacing="0">Bayesian</text>
</svg>